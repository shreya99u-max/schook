<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        table { width: 100%; background: white; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #333; color: white; }
    </style>
</head>
<body>
    <h2>📊 Live Student Data</h2>
    <div id="loginSection">
        <input type="password" id="pass" placeholder="Enter Admin Password">
        <button onclick="loadData()">Login</button>
    </div>
    <table id="dataTable" style="display:none;">
        <thead>
            <tr><th>Name</th><th>DOB</th><th>Mobile</th><th>Father</th><th>Aadhar</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        async function loadData() {
            const password = document.getElementById('pass').value;
            const res = await fetch('/api/responses', {
                method: 'POST',
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('loginSection').style.display = "none";
                document.getElementById('dataTable').style.display = "table";
                const tbody = document.getElementById('tbody');
                tbody.innerHTML = data.responses.map(r => 
                    `<tr><td>${r.name}</td><td>${r.dob}</td><td>${r.mobile}</td><td>${r.father}</td><td>${r.aadhar}</td></tr>`
                ).join('');
            } else { alert("Wrong Password!"); }
        }
    </script>
</body>
</html>
